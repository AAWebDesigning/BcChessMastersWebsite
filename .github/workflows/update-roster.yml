name: Update pre-registered roster

# Pulls the published Google Sheet and commits the rendered roster into
# bc-elite-invitational-1.html + players.json. Hourly is well ahead of the rate
# registrations actually arrive; use "Run workflow" for an immediate update
# after adding someone.
#
# Requires a repository variable ROSTER_CSV_URL — see scripts/update-roster.mjs.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-roster
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync roster from Google Sheet
        env:
          ROSTER_CSV_URL: ${{ vars.ROSTER_CSV_URL }}
        run: node scripts/update-roster.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Roster unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bc-elite-invitational-1.html players.json
          git commit -m "Update pre-registered roster"
          git push
