name: Update pre-registered roster

# Pulls the published Google Sheet and commits the rendered roster into
# bc-elite-invitational-1.html + players.json. Use "Run workflow" for an
# immediate update after adding someone.
#
# Requires a repository variable ROSTER_CSV_URL — see scripts/update-roster.mjs.
#
# Why :17 and :47 rather than a single :00 — GitHub treats scheduled runs as
# best-effort and drops or delays them under load, and the top of the hour is
# the most contended slot on the platform. Two attempts an hour at off-peak
# minutes means a skipped tick costs 30 minutes instead of a full hour. Extra
# runs are close to free: the script only writes when the roster actually
# changed, so a no-op run commits nothing and triggers no Pages rebuild.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-roster
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync roster from Google Sheet
        env:
          ROSTER_CSV_URL: ${{ vars.ROSTER_CSV_URL }}
        run: node scripts/update-roster.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Roster unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bc-elite-invitational-1.html players.json
          git commit -m "Update pre-registered roster"
          git push
